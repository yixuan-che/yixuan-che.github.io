name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

# Only the newest push may deploy Pages. This prevents a previous deployment
# from blocking all later pushes.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: pnpm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub left this older Pages deployment in an in-progress state even
      # after its workflow failed. Mark it inactive so it cannot block deploys.
      - name: Release stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/deployments/6127995467/statuses" \
            --data '{"state":"inactive","environment":"github-pages"}'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
